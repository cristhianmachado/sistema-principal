name: Atualizar Submodule Automaticamente
on:
  repository_dispatch:
    types: [atualizou-componente] # O nome do "sinal" que vamos escutar

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }} # Usa o seu token para ter permissão de push
          submodules: recursive
          fetch-depth: 0

      - name: Atualizar submodules para a última versão
        run: git submodule update --remote --recursive

      - name: Comitar a atualização do ponteiro
        run: |
          if [[ $(git status --porcelain) ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "chore: componente atualizado via disparo automático"
            git push
          else
            echo "Já estava atualizado."
          fi
